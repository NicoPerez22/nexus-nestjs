services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_local_password
      POSTGRES_DB: nexus_hq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexus_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_hq"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nexus_data:
