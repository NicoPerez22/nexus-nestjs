services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_USER: nexus
      MYSQL_PASSWORD: nexus_local_password
      MYSQL_DATABASE: nexus_hq
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - nexus_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u nexus -pnexus_local_password"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nexus_data:
